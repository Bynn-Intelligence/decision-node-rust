name: release

# Builds the crate exactly as crates.io will receive it, on every push to main
# and on every v* tag, and publishes it from a v* tag only.
#
# What the repository needs before the first release (none of it is created by
# this workflow):
#
# - Environment "release" (Settings, Environments): required reviewers, the
#   people who approve a publish; deployment branches and tags limited to the
#   tag rule "v*". The publish job waits there until a reviewer approves it.
# - crates.io trusted publisher, added on the crate's page under Settings,
#   Trusted Publishing, GitHub, once the crate exists:
#     Repository owner: Bynn-Intelligence
#     Repository name:  decision-node-rust
#     Workflow filename: release.yml
#     Environment:      release
# - Secret CARGO_BOOTSTRAP_TOKEN in environment "release", for the FIRST
#   publish only: crates.io adds a trusted publisher only to a crate that is
#   already published (https://crates.io/docs/trusted-publishing,
#   "Prerequisites"), so version 0.3.0 goes out with a crates.io API token
#   scoped to publish-new and publish-update for bynn-decisionnode. When the
#   secret is set it is used and the OIDC exchange is skipped. Delete the
#   secret, and revoke the token on crates.io, right after the first publish
#   and once the trusted publisher above is added; every later release uses
#   trusted publishing alone.
#
# No other secret or variable is read. The dry-run job has read access to the
# repository and nothing else; only the publish job gets id-token: write (the
# OIDC exchange with crates.io) and contents: write (the GitHub release).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATE: bynn-decisionnode
  # One toolchain for both jobs, so the publish job's package is byte for byte
  # the dry-run's.
  RUST_TOOLCHAIN: 1.99.0

# Every action is pinned to a full commit SHA, with its tag or branch in a
# comment, and no checkout leaves credentials in the working copy.
jobs:
  dry-run:
    name: Package and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Check the metadata
        shell: bash
        run: |
          set -euo pipefail
          # Scratch files go to the runner's temporary directory: a file left
          # in the checkout would make cargo refuse the package as dirty.
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json, os, re, sys
          pkg = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "metadata.json")))["packages"][0]
          fail = []
          def need(cond, what):
              if not cond:
                  fail.append(what)
          need(pkg["name"] == os.environ["CRATE"], f"name is {pkg['name']!r}")
          need(pkg.get("license") == "MIT", f"license is {pkg.get('license')!r}")
          need(pkg.get("readme") == "README.md", f"readme is {pkg.get('readme')!r}")
          need(pkg.get("repository") == "https://github.com/Bynn-Intelligence/decision-node-rust",
               f"repository is {pkg.get('repository')!r}")
          need(bool(pkg.get("description")), "no description")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              want = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              source = f"the tag {os.environ['GITHUB_REF_NAME']}"
          else:
              top = re.search(r"^## \[([^\]]+)\]", open("CHANGELOG.md").read(), re.M)
              want = top.group(1) if top else None
              source = "the CHANGELOG's top entry"
          need(pkg["version"] == want, f"version {pkg['version']} differs from {source} ({want})")
          for word in ("face_detection", "wanted_person"):
              need(word not in (pkg.get("description") or ""), f"the description names {word}")
          if fail:
              for f in fail:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"{pkg['name']} {pkg['version']}: metadata checked")
          PY
      - name: Package
        run: cargo package --locked
      - name: Check the contents
        shell: bash
        run: |
          set -euo pipefail
          crate="target/package/${CRATE}-$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])').crate"
          echo "CRATE_FILE=$crate" >> "$GITHUB_ENV"
          # Only these files may be published.
          allowed='^(\.cargo_vcs_info\.json|Cargo\.toml|Cargo\.toml\.orig|Cargo\.lock|README\.md|CHANGELOG\.md|LICENSE|src/[a-z_]+\.rs|examples/[a-z_]+\.rs)$'
          tar -tzf "$crate" | sed 's|^[^/]*/||' | grep -v '^$' | sort > "$RUNNER_TEMP/contents.txt"
          cat "$RUNNER_TEMP/contents.txt"
          if grep -vE "$allowed" "$RUNNER_TEMP/contents.txt"; then
            echo "::error::the files above are not on the allowlist"
            exit 1
          fi
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir "$unpacked"
          tar -xzf "$crate" -C "$unpacked"
          # Words no published file may hold (internal names, internal paths,
          # attribution lines), kept encoded so this public file does not spell
          # them out.
          denied="$(printf '%s' 'ZG9jcy9bMC05XXsyfXxiYWNrZW5kL1swLTldezJ9fHByb2R1Y3RzL3wvVXNlcnMvfGNvLWF1dGhvcmVkLWJ5fGdlbmVyYXRlZCB3aXRo' | base64 -d)"
          if grep -rniE "$denied" "$unpacked"; then
            echo "::error::the package holds the words above"
            exit 1
          fi
          if grep -niE 'face_detection|wanted_person' "$unpacked"/*/README.md; then
            echo "::error::the README names a booster the API does not serve yet"
            exit 1
          fi
          # The checksum names the file alone, so it checks wherever the file is
          # downloaded.
          (cd "$(dirname "$crate")" && sha256sum "$(basename "$crate")" | tee "$(basename "$crate").sha256")
      - name: Publish, dry run
        run: cargo publish --locked --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate
          path: |
            ${{ env.CRATE_FILE }}
            ${{ env.CRATE_FILE }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to crates.io
    if: github.ref_type == 'tag'
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only a commit already on main is released: a tag pushed on any other
      # branch, or on a commit that never went through review, stops here.
      - name: Check that the tag is on main
        shell: bash
        run: |
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot check the tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $tagged, which is not on main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} ($tagged) is on main"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate
          path: ${{ runner.temp }}/dist
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # cargo publishes only a package it builds itself, never a given .crate
      # file. So the package is built again from the same commit with the same
      # toolchain, and published only when it is byte for byte the dry-run's.
      - name: Check that the package is the dry-run's
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          version="${GITHUB_REF_NAME#v}"
          built="target/package/${CRATE}-${version}.crate"
          dist="$RUNNER_TEMP/dist"
          want="$(cut -d' ' -f1 "$dist/${CRATE}-${version}.crate.sha256")"
          got="$(sha256sum "$built" | cut -d' ' -f1)"
          (cd "$dist" && sha256sum -c "${CRATE}-${version}.crate.sha256")
          if [ "$got" != "$want" ]; then
            echo "::error::the package built here ($got) is not the dry-run's ($want)"
            exit 1
          fi
          echo "the package is the dry-run's: $got"
      - name: Trusted publishing token
        id: auth
        if: env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_TOKEN != '' && env.BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The notes are this version's CHANGELOG section, without its heading.
          python3 - "$version" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          text = open("CHANGELOG.md").read()
          m = re.search(r"^## \[" + re.escape(sys.argv[1]) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"no CHANGELOG section for {sys.argv[1]}")
          print(m.group(1).strip())
          PY
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist/${CRATE}-${version}.crate" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
