# OpenSSF Scorecard: an automated, weekly audit of this repo's supply-chain
# security posture — Signed-Releases, Token-Permissions, Pinned-Dependencies,
# Dangerous-Workflow, and more. publish_results feeds the badge in the README
# and the public report at scorecard.dev; the SARIF upload surfaces findings in
# this repo's Security tab.
#
# Actions are pinned by commit SHA on purpose: Scorecard's own
# Pinned-Dependencies check expects it, and it is the posture the rest of this
# project's supply chain already takes.
#
# Runs only while the repository is public: nothing is bumped, tagged or
# published while it is private, and no report is published.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write        # publish results for the badge (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: results.sarif
