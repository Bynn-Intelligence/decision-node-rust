[package]
name = "bynn-decisionnode"
version = "0.3.0"
edition = "2021"
description = "The official Rust client for the DecisionNode API: typed truth, choice, score and number decisions, images and videos, boosters, sessions and batches."
license = "MIT"
authors = ["Bynn Intelligence, Inc."]
repository = "https://github.com/Bynn-Intelligence/decision-node-rust"
homepage = "https://decisionnode.com"
documentation = "https://docs.rs/bynn-decisionnode"
readme = "README.md"
keywords = ["decisionnode", "decision", "classification", "api", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["/.github", "/tests", "/.gitignore", "/rustfmt.toml"]

[lib]
name = "decisionnode"
path = "src/lib.rs"

[features]
default = ["rustls-tls", "sessions"]
# A synchronous client in `decisionnode::blocking`.
blocking = ["tokio/rt-multi-thread"]
# Sessions over a WebSocket (`DecisionNode::open_session`, `supervise`).
sessions = ["dep:tokio-tungstenite"]
# TLS backends, passed through to reqwest; sessions use the same client settings.
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
base64 = "0.22"
bytes = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
indexmap = "2"
log = "0.4"
md-5 = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
tokio = { version = "1", features = ["time", "sync", "rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
regex = "1"
# The suite's request log echoes bodies nested 128 levels deep.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "net", "io-util"] }

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false

[[example]]
name = "blocking"
required-features = ["blocking"]

[package.metadata.docs.rs]
all-features = false
features = ["blocking", "sessions"]
